<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praider - Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-400 tracking-wide mb-2">PRAIDER</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest">Crypto Investment Platform</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl mb-6">
            <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-900 text-emerald-400 transition">
                Login
            </button>
            <button id="signupTabBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition">
                Sign Up
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="loginEmail" placeholder="name@example.com" required class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition duration-200">
                Login
            </button>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Full Name</label>
                <div class="relative">
                    <i data-lucide="user" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="regName" placeholder="John Doe" required class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="regEmail" placeholder="name@example.com" required class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="regPassword" placeholder="••••••••" required class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition duration-200">
                Create Account
            </button>
        </form>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Switch between Login and Register tabs
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-900 text-emerald-400 transition";
                signupBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                signupBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-900 text-emerald-400 transition";
                loginBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition";
            }
        }

        // Live Backend Base URL
        const BACKEND_URL = 'https://praider-backend.onrender.com';

        // Handle Registration
        async function handleRegister(event) {
            event.preventDefault();

            const fullName = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fullName, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Account created successfully! Switching to login tab...');
                    switchTab('login');
                    document.getElementById('loginEmail').value = email;
                } else {
                    alert(data.message || 'Registration failed.');
                }
            } catch (error) {
                alert('Could not connect to backend server.');
            }
        }

        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Login failed.');
                }
            } catch (error) {
                alert('Could not connect to backend server.');
            }
        }
    </script>
</body>
</html>
