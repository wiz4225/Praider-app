<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAIDER - Account Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- Main Auth Container -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    
    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <div class="flex justify-center items-center gap-2 mb-2">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-2xl text-white">P</div>
        <h1 class="text-2xl font-bold tracking-wider">PRAIDER</h1>
      </div>
      <p class="text-xs text-gray-400">Institutional Crypto Trading Platform</p>
    </div>

    <!-- Tab Switchers -->
    <div class="flex bg-slate-800 p-1 rounded-xl mb-6">
      <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all">Sign In</button>
      <button id="signupTabBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="email" id="loginEmail" placeholder="name@example.com" required class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
          <a href="#" class="text-xs text-blue-400 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30">
        Sign In to Dashboard
      </button>
    </form>

    <!-- SIGNUP FORM (Hidden by default) -->
    <form id="signupForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
        <div class="relative">
          <i data-lucide="user" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="regName" placeholder="John Doe" required class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="email" id="regEmail" placeholder="name@example.com" required class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="password" id="regPassword" placeholder="••••••••" required class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30">
        Create Account
      </button>
    </form>

    <!-- Footer link -->
    <div class="mt-8 text-center pt-6 border-t border-slate-800">
    <a href="home.html" class="text-xs text-gray-400 hover:text-white transition-colors">← Back to Home Page</a>
    </div>

  </div>

  <!-- JavaScript Section -->
  <script>
    // Initialize Icons
    lucide.createIcons();

    // Switch between Login and Signup tabs
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const loginBtn = document.getElementById('loginTabBtn');
      const signupBtn = document.getElementById('signupTabBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        loginBtn.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all';
        signupBtn.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        signupBtn.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all';
        loginBtn.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all';
      }
    }

    // Register Function
    async function handleRegister(event) {
      event.preventDefault();

      const fullName = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const response = await fetch('/api/...', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Account created successfully! Switching to login tab...');
          switchTab('login');
          document.getElementById('loginEmail').value = email;
        } else {
          alert(data.message || 'Registration failed.');
        }
      } catch (error) {
        alert('Could not connect to backend server. Make sure node server.js is running!');
      }
    }

    // Login Function
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('praider_token', data.token);
          localStorage.setItem('praider_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          alert(data.message || 'Invalid email or password.');
        }
      } catch (error) {
        alert('Could not connect to backend server. Make sure node server.js is running!');
      }
    }
  </script>

</body>
</html>
